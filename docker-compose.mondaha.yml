# docker-compose.mondaha.yml
# ---------------------------------------------------------------------------
# Sobe SOMENTE o serviço svc-face-recon conectado à rede EXTERNA do stack
# mondaha. Reutiliza os serviços postgres / minio / redis que já estão
# rodando no compose principal do mondaha (não os recria aqui).
#
# Pré-requisitos:
#   1. O stack mondaha já deve estar de pé (docker compose up -d na raiz do
#      mondaha), expondo postgres:5432, minio:9000 e redis:6379 na sua rede.
#   2. Confirme o nome da rede externa com `docker network ls` e ajuste
#      `networks.mondaha.name` abaixo se necessário (padrão do compose = nome
#      da pasta + "_default", ex.: mondaha_default).
#
# Uso:
#   docker compose -f docker-compose.mondaha.yml up -d --build
# ---------------------------------------------------------------------------
services:
  svc-face-recon:
    build:
      context: .
      dockerfile: Dockerfile
    image: svc-face-recon:mondaha
    container_name: svc-face-recon
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mondaha:mondaha@postgres:5432/mondaha
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: uploads
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - mondaha

networks:
  mondaha:
    external: true
    # Ajuste o nome conforme `docker network ls` (padrão = <pasta>_default).
    name: mondaha_default
